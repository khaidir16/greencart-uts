databases:
  - name: greencart-db
    databaseName: greencart
    user: greencart
    plan: free

services:
  - type: web
    name: greencart-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace @greencart/api
    startCommand: npm run db:migrate:deploy --workspace @greencart/api && npm run db:seed --workspace @greencart/api && npm run start --workspace @greencart/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: greencart-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: greencart-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @greencart/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
